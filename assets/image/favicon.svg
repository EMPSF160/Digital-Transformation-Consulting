<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C2BFF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6C2BFF" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="512" height="512" rx="128" fill="#0F172A"/>
  <!-- Glowing Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#nexusGrad)" stroke-width="12" opacity="0.4"/>
  <!-- NEXUS 3D Cube / N Icon -->
  <g transform="translate(106, 106)" filter="url(#shadow)">
    <!-- Top Face -->
    <polygon points="150,30 270,100 150,170 30,100" fill="url(#nexusGrad)" opacity="0.95"/>
    <!-- Left Face -->
    <polygon points="30,100 150,170 150,270 30,200" fill="#6C2BFF" opacity="0.8"/>
    <!-- Right Face -->
    <polygon points="150,170 270,100 270,200 150,270" fill="#00E5FF" opacity="0.85"/>
    <!-- Inner Core Core Glow -->
    <circle cx="150" cy="150" r="28" fill="#FFFFFF"/>
  </g>
</svg>
