<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | NEXUS Executive Advisory</title>
    <meta name="description" content="Create your executive advisory account with NEXUS CONSULTING.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/animations.css">
</head>
<body class="light-theme">

    <!-- Auth Page Main Wrapper -->
    <div class="auth-page-wrapper">
        <div class="auth-ambient-glow"></div>

        <!-- Floating Sign Up Card -->
        <div class="auth-card" data-aos="fade-up">
            
            <!-- Brand Header (Clickable to Home) -->
            <a href="index.html" class="auth-brand-logo text-decoration-none" title="Back to Home">
                <div class="auth-brand-box">
                    <i class="fas fa-cube"></i>
                </div>
                <span class="auth-brand-name">NEXUS</span>
            </a>

            <!-- Card Headings -->
            <h2 class="auth-title">Join the Firm</h2>
            <p class="auth-subtitle">Create your executive advisory account</p>

            <!-- Sign Up Form -->
            <form onsubmit="event.preventDefault(); alert('Account created successfully! Redirecting to Executive Portal...'); window.location.href='dashboard.html';">
                <!-- Full Name Field -->
                <div class="mb-3 text-start">
                    <label class="auth-form-label">Full Name</label>
                    <input type="text" class="auth-input-field" placeholder="Enter your full name" required>
                </div>

                <!-- Email Field -->
                <div class="mb-3 text-start">
                    <label class="auth-form-label">Email Address</label>
                    <input type="email" class="auth-input-field" placeholder="Enter your email" required>
                </div>

                <!-- Password Field -->
                <div class="mb-3 text-start">
                    <label class="auth-form-label">Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="signupPassword" class="auth-input-field" placeholder="••••••••" required>
                        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('signupPassword', this)">
                            <i class="far fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password Field -->
                <div class="mb-3 text-start">
                    <label class="auth-form-label">Confirm Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="confirmPassword" class="auth-input-field" placeholder="••••••••" required>
                        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('confirmPassword', this)">
                            <i class="far fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Terms Checkbox -->
                <div class="d-flex align-items-center mb-4">
                    <label class="d-flex align-items-center gap-2 small text-secondary cursor-pointer">
                        <input type="checkbox" class="auth-checkbox" required checked>
                        <span class="fw-semibold text-dark">I agree to the <a href="#" class="auth-footer-link">Terms and Conditions</a> and <a href="#" class="auth-footer-link">Privacy Policy</a></span>
                    </label>
                </div>

                <!-- Create Account Button -->
                <button type="submit" class="auth-btn-submit">Create Account</button>
            </form>

            <!-- Divider -->
            <div class="auth-divider">
                <span>Or sign up with</span>
            </div>

            <!-- Social Sign-up Buttons -->
            <div class="social-auth-grid">
                <a href="#" onclick="window.location.href='dashboard.html'; return false;" class="social-auth-btn google" title="Sign up with Google">
                    <i class="fab fa-google"></i>
                </a>
                <a href="#" onclick="window.location.href='dashboard.html'; return false;" class="social-auth-btn apple" title="Sign up with Apple">
                    <i class="fab fa-apple"></i>
                </a>
                <a href="#" onclick="window.location.href='dashboard.html'; return false;" class="social-auth-btn facebook" title="Sign up with Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>
            </div>

            <!-- Footer Link -->
            <div class="auth-footer-text">
                <span>Already have an account? </span>
                <a href="login.html" class="auth-footer-link">Login</a>
            </div>

        </div>
    </div>

    <script>
        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'far fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'far fa-eye';
            }
        }
    </script>
</body>
</html>
